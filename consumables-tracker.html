<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hematology Supply Monitor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#12151a; --bg-grad:#171b21; --panel:#1b1f26; --panel2:#242a33; --line:#333c47; --line-soft:#262c35;
    --text:#eceae4; --text-dim:#9fa7b3; --text-faint:#616a76;
    --ok:#4fc4b8; --ok-dim:#1f3d3a; --warn:#eeae4a; --warn-dim:#4a3a19; --crit:#e0665a; --crit-dim:#4a231f;
    --accent:#5fb8ff; --accent-dim:#1c3450;
    --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sans:'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    --disp:'Oswald', var(--sans);
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    --radius: 8px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(circle at 15% 0%, var(--bg-grad), var(--bg) 55%);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  #app{max-width:1120px;margin:0 auto;padding:28px 18px 70px;}
  .auth-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:32px 28px;width:100%;max-width:380px;box-shadow:var(--shadow);}
  .auth-mark{width:44px;height:44px;border-radius:10px;background:var(--ok-dim);border:1px solid var(--ok);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px;}
  .auth-title{font-family:var(--disp);font-weight:600;letter-spacing:.3px;font-size:19px;margin:0 0 4px;text-transform:uppercase;}
  .auth-sub{font-size:13px;color:var(--text-dim);margin:0 0 20px;}
  .auth-err{background:var(--crit-dim);color:var(--crit);border:1px solid var(--crit);border-radius:5px;padding:8px 10px;font-size:12px;margin-bottom:14px;}
  .fld{margin-bottom:12px;}
  .fld label{display:block;font-size:11px;color:var(--text-faint);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
  input,select,button,textarea{font-family:inherit;font-size:13px;}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],select,textarea{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:6px;width:100%;transition:border-color .15s;
  }
  input:focus,select:focus{outline:none;border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-dim);}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 15px;border-radius:6px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,background .15s,transform .05s;}
  button:hover{border-color:var(--text-dim);}
  button:active{transform:translateY(1px);}
  button.primary{background:var(--ok);border-color:var(--ok);color:#08211f;font-weight:600;}
  button.primary:hover{background:#63d2c5;border-color:#63d2c5;}
  button.danger{background:var(--crit-dim);border-color:var(--crit);color:var(--crit);}
  button.danger:hover{background:var(--crit);color:#2c0e0a;}
  button.ghost{background:transparent;border-color:transparent;color:var(--text-dim);padding:7px 10px;}
  button.ghost:hover{color:var(--text);border-color:var(--line);background:var(--panel2);}
  button.small{padding:6px 11px;font-size:12px;}
  .hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:16px;flex-wrap:wrap;gap:12px;}
  .hdr-title{display:flex;align-items:center;gap:12px;}
  .hdr-mark{width:38px;height:38px;border-radius:9px;background:var(--ok-dim);border:1px solid var(--ok);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .hdr h1{font-family:var(--disp);font-weight:600;font-size:20px;margin:0;letter-spacing:.4px;text-transform:uppercase;}
  .hdr .sub{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:3px;letter-spacing:.3px;}
  .hdr-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .badge-btn{position:relative;}
  .badge-count{background:var(--warn);color:#3a2a08;font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px;margin-left:2px;}
  .badge-count.crit{background:var(--crit);color:#3a0d08;}
  .toolbar{display:flex;gap:14px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .area-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .area-tab{background:var(--panel);border:1px solid var(--line);color:var(--text-dim);padding:8px 18px;border-radius:22px;font-size:12px;font-weight:600;letter-spacing:.4px;transition:all .15s;}
  .area-tab:hover{border-color:var(--text-dim);color:var(--text);}
  .area-tab.active{background:var(--ok);border-color:var(--ok);color:#08211f;box-shadow:0 2px 10px rgba(79,196,184,.35);}
  .panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow);}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line-soft);}
  .panel-title{font-family:var(--disp);font-size:14px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:.5px;}
  .panel-close{background:transparent;border:none;color:var(--text-faint);font-size:20px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:6px;}
  .panel-close:hover{color:var(--crit);background:var(--crit-dim);}
  table{width:100%;border-collapse:collapse;}
  th{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:0 10px 10px;font-weight:600;border-bottom:1px solid var(--line);}
  td{padding:10px;font-size:13px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tbody tr:hover td{background:var(--panel2);}
  td.num{font-family:var(--mono);text-align:right;}
  .card{background:var(--panel);border:1px solid var(--line-soft);border-left:4px solid var(--ok);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);transition:border-color .15s;}
  .card.warn{border-left-color:var(--warn);}
  .card.crit{border-left-color:var(--crit);}
  .card-top{display:flex;align-items:center;gap:16px;padding:14px 16px;flex-wrap:wrap;}
  .card-main{flex:1;min-width:200px;}
  .card-name{font-weight:600;font-size:14.5px;letter-spacing:.1px;}
  .card-meta{font-size:11px;color:var(--text-dim);font-family:var(--mono);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .gauge-wrap{width:120px;flex-shrink:0;}
  .gauge{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;}
  .gauge-fill{height:100%;border-radius:4px;transition:width .3s;}
  .gauge-fill.ok{background:var(--ok);}
  .gauge-fill.warn{background:var(--warn);}
  .gauge-fill.crit{background:var(--crit);}
  .status-tag{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.3px;font-weight:600;}
  .status-tag.ok{background:var(--ok-dim);color:var(--ok);}
  .status-tag.warn{background:var(--warn-dim);color:var(--warn);}
  .status-tag.crit{background:var(--crit-dim);color:var(--crit);}
  .status-tag.pending{background:var(--warn-dim);color:var(--warn);}
  .status-tag.synced{background:var(--ok-dim);color:var(--ok);}
  .status-tag.sync_error{background:var(--crit-dim);color:var(--crit);}
  .card-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .today-line{font-size:11px;color:var(--text-faint);font-family:var(--mono);padding:0 16px 12px;}
  .today-line b{color:var(--text-dim);}
  .action-panel{display:none;padding:14px 16px;border-top:1px solid var(--line-soft);background:var(--panel2);flex-wrap:wrap;gap:12px;align-items:flex-end;}
  .action-panel.open{display:flex;animation:slideDown .15s ease;}
  @keyframes slideDown{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  .action-panel .fld{margin-bottom:0;min-width:120px;}
  .action-panel input,.action-panel select{width:auto;min-width:120px;}
  .err-msg{color:var(--crit);font-size:12px;width:100%;display:none;background:var(--crit-dim);padding:8px 10px;border-radius:5px;}
  .empty{padding:48px 20px;text-align:center;color:var(--text-faint);border:1px dashed var(--line);border-radius:var(--radius);}
  .empty i{font-size:26px;display:block;margin-bottom:10px;opacity:.7;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(6px);background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 20px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:90vw;box-shadow:var(--shadow);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end;}
  .filter-row label{font-size:11px;color:var(--text-dim);display:flex;flex-direction:column;gap:4px;}
  .grid-table{font-size:12px;}
  .grid-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--text-faint);padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .grid-table td{padding:3px 4px;border-bottom:1px solid var(--line-soft);}
  .grid-table input,.grid-table select{padding:5px 6px;font-size:12px;min-width:64px;}
  .grid-table input[type=number]{width:64px;}
  .grid-table tr.dirty td{background:var(--warn-dim);}
  .grid-table .gbal{font-family:var(--mono);color:var(--text-dim);white-space:nowrap;}
  .grid-table .grow-save{padding:5px 9px;font-size:11px;}
  .grid-table .item-name{white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;}
  .checkbox-row{display:flex;gap:12px;flex-wrap:wrap;}
  .checkbox-row label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim);text-transform:none;letter-spacing:0;}
  .checkbox-row input{width:auto;}
  .breakdown{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
  .kpi-tile{background:var(--panel2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px 16px;}
  .kpi-tile .kpi-icon{color:var(--text-faint);font-size:16px;margin-bottom:6px;}
  .kpi-num{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1;}
  .kpi-num.warn{color:var(--warn);}
  .kpi-num.crit{color:var(--crit);}
  .kpi-num.ok{color:var(--ok);}
  .kpi-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;margin-top:6px;}
  .dash-section-title{font-family:var(--disp);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin:22px 0 12px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .bar-row .bar-label{width:64px;flex-shrink:0;font-family:var(--mono);font-size:11px;color:var(--text-dim);}
  .bar-row .bar-track{flex:1;background:var(--panel2);border-radius:4px;height:14px;overflow:hidden;}
  .bar-row .bar-fill{height:100%;border-radius:4px;transition:width .3s;}
  .bar-row .bar-val{width:32px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--text-dim);flex-shrink:0;}
  .activity-feed .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12px;}
  .activity-feed .row:last-child{border-bottom:none;}
  .activity-feed .meta{color:var(--text-faint);font-family:var(--mono);font-size:11px;}
  .area-mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
  .area-mini-card{background:var(--panel2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px;}
  .area-mini-card h4{margin:0 0 8px;font-family:var(--disp);font-size:13px;text-transform:uppercase;letter-spacing:.4px;}
  .area-mini-card .row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);padding:3px 0;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
  .print-head{display:none;}
  @media print{
    :root{
      --bg:#fff; --panel:#fff; --panel2:#f5f5f5; --line:#999; --line-soft:#ccc;
      --text:#111; --text-dim:#333; --text-faint:#555;
      --ok:#2f7d7b; --ok-dim:#e3f2f1; --warn:#8a5a10; --warn-dim:#fbe9d0; --crit:#a33226; --crit-dim:#f6dedb;
    }
    body{background:#fff;}
    body.printing-report #authGate, body.printing-report .hdr, body.printing-report .toolbar,
    body.printing-report .area-tabs, body.printing-report #list, body.printing-report #emptyState,
    body.printing-report #lowStockPanel, body.printing-report #expiringPanel, body.printing-report #itemsPanel,
    body.printing-report #disposalPanel, body.printing-report .filter-row, body.printing-report button{
      display:none !important;
    }
    body.printing-report .print-head{ display:block !important; margin-bottom:14px; }
    body.printing-report #reportsPanel{ display:block !important; border:none; padding:0; }
    body.printing-report table{ font-size:11px; }
    body.printing-report td, body.printing-report th{ border-color:#ccc; }
  }
</style>
</head>
<body>
<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <div class="auth-mark"><i class="ti ti-droplet-filled" aria-hidden="true"></i></div>
    <h1 class="auth-title">Hematology Supply Monitor</h1>
    <p class="auth-sub">Sign in with your staff account to continue.</p>
    <div class="auth-err" id="authErr" style="display:none;"></div>
    <div class="fld"><label>Email</label><input type="email" id="authEmail" autocomplete="username"></div>
    <div class="fld"><label>Password</label><input type="password" id="authPassword" autocomplete="current-password"></div>
    <button class="primary" id="btnAuthSignIn" style="width:100%;margin-top:6px;">Sign in</button>
  </div>
</div>

<div id="app" style="display:none;">
  <h2 class="sr-only">Hematology supply monitor: daily ledger, low-stock and expiry alerts, disposal records.</h2>
  <div class="hdr">
    <div class="hdr-title">
      <div class="hdr-mark"><i class="ti ti-droplet-filled" aria-hidden="true"></i></div>
      <div>
        <h1>Hematology Supply Monitor</h1>
        <div class="sub" id="dateLabel">—</div>
      </div>
    </div>
    <div class="hdr-right">
      <button id="btnDashboard"><i class="ti ti-layout-dashboard" aria-hidden="true"></i>Dashboard</button>
      <button id="btnSearch"><i class="ti ti-search" aria-hidden="true"></i>Search</button>
      <button class="ghost badge-btn" id="btnLowStock"><i class="ti ti-alert-triangle" aria-hidden="true"></i>Low stock<span class="badge-count" id="lowStockCount" style="display:none;"></span></button>
      <button class="ghost badge-btn" id="btnExpiring"><i class="ti ti-hourglass-low" aria-hidden="true"></i>Expiring<span class="badge-count crit" id="expiringCount" style="display:none;"></span></button>
      <button id="btnItems"><i class="ti ti-list-details" aria-hidden="true"></i>Items</button>
      <button id="btnDisposal"><i class="ti ti-recycle" aria-hidden="true"></i>Disposal report</button>
      <button id="btnReports"><i class="ti ti-report" aria-hidden="true"></i>Reports</button>
      <button id="btnGrid"><i class="ti ti-table" aria-hidden="true"></i>Daily grid</button>
      <button class="ghost" id="btnLogout"><i class="ti ti-logout" aria-hidden="true"></i>Log out</button>
    </div>
  </div>

  <div class="toolbar">
    <label style="font-size:11px;color:var(--text-dim);display:flex;flex-direction:column;gap:4px;text-transform:uppercase;letter-spacing:.4px;">Date
      <input type="date" id="viewDate">
    </label>
    <span id="loggedInAs" style="font-family:var(--mono);font-size:11px;color:var(--text-faint);display:inline-flex;align-items:center;gap:5px;"></span>
  </div>

  <div class="area-tabs" id="areaTabs"></div>

  <div class="panel" id="dashboardPanel" style="display:none;"></div>
  <div class="panel" id="searchPanel" style="display:none;"></div>
  <div class="panel" id="lowStockPanel" style="display:none;"></div>
  <div class="panel" id="expiringPanel" style="display:none;"></div>
  <div class="panel" id="itemsPanel" style="display:none;"></div>
  <div class="panel" id="disposalPanel" style="display:none;"></div>
  <div class="panel" id="reportsPanel" style="display:none;"></div>
  <div class="panel" id="gridPanel" style="display:none;"></div>

  <div id="list"></div>
  <div class="empty" id="emptyState" style="display:none;"><i class="ti ti-package" aria-hidden="true"></i>No items in this area yet.</div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://kmxosxetjwcqssobmzqx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_gt-tS7qafI0ywdhXA6bGjg_ButzCmQR';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showApp(){ document.getElementById('authGate').style.display='none'; document.getElementById('app').style.display=''; }
function showAuthGate(){ document.getElementById('app').style.display='none'; document.getElementById('authGate').style.display=''; }
function authError(msg){ const el=document.getElementById('authErr'); el.textContent=msg; el.style.display='block'; }

document.getElementById('btnAuthSignIn').addEventListener('click', async ()=>{
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  document.getElementById('authErr').style.display='none';
  if(!email || !password){ authError('Enter your email and password.'); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ authError(error.message); return; }
  showApp();
  await boot();
});
document.getElementById('btnLogout').addEventListener('click', async ()=>{
  await sb.auth.signOut();
  document.getElementById('authEmail').value=''; document.getElementById('authPassword').value='';
  document.getElementById('authErr').style.display='none';
  showAuthGate();
});
(async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ showApp(); await boot(); } else { showAuthGate(); }
})();

let toastTimer=null;
function showToast(msg){
  const el=document.getElementById('toast'); if(!el) return;
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'), 2800);
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ if(n==null) return '0'; const r=Math.round(n*100)/100; return Number.isInteger(r) ? r.toString() : r.toFixed(2); }
function todayISO(){ const d=new Date(); const tz=d.getTimezoneOffset()*60000; return new Date(d.getTime()-tz).toISOString().slice(0,10); }
function addDaysISO(dateStr, delta){
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + delta);
  const tz = d.getTimezoneOffset()*60000;
  return new Date(d.getTime()-tz).toISOString().slice(0,10);
}

// ---- global state ----
let areas = [];       // [{id,code,name}]
let suppliers = [];   // [{id,code,name}]
let items = [];       // [{id,name,unit_of_measure,is_consumable,default_supplier_id,reorder_threshold,is_active,areaIds:Set}]
let ledgerByKey = {};  // `${item_id}|${area_id}` -> [entries sorted by entry_date asc]
let allLedgerFlat = []; // every daily_ledger_entries row currently loaded, flat, for reports
let activeAreaCode = null;
let viewDate = todayISO();

// The ledger grows by roughly (items x areas) rows every single day forever,
// so loading the WHOLE table on every page load doesn't scale — it's fine
// today, but would make the app progressively slower to open every month as
// history piles up. Instead we keep a rolling window of recent days loaded
// by default (plenty for daily use, dashboard, and search), and only reach
// further back into history on demand when a report's date filter actually
// asks for it. ledgerLoadedFrom tracks the earliest date currently in memory.
const LEDGER_WINDOW_DAYS = 400; // ~13 months of daily use, loaded by default
let ledgerLoadedFrom = null;

function ledgerKey(itemId, areaId){ return itemId+'|'+areaId; }
function entriesFor(itemId, areaId){ return ledgerByKey[ledgerKey(itemId, areaId)] || []; }
function balanceAsOf(itemId, areaId, dateStr){
  const arr = entriesFor(itemId, areaId);
  let last = null;
  for(const e of arr){ if(e.entry_date <= dateStr) last = e; else break; }
  return last ? Number(last.balance) : 0;
}
function entryOnDate(itemId, areaId, dateStr){
  const arr = entriesFor(itemId, areaId);
  return arr.find(e => e.entry_date === dateStr) || null;
}

// PostgREST caps an unpaginated select at (usually) 1000 rows. Page through
// with .range() until a page comes back short, so every row in the
// requested range loads regardless of how many rows match. fromDate is
// optional — omit it to fetch everything from the beginning (used only when
// explicitly expanding the loaded window further back).
async function fetchLedgerRowsInRange_(fromDate, toDate){
  const pageSize = 1000;
  let from = 0;
  let all = [];
  while(true){
    let q = sb.from('daily_ledger_entries')
      .select('id,item_id,area_id,entry_date,balance,in_qty,source_code,out_qty,write_off_qty,write_off_reason,transfer_qty,transfer_to_code,sync_status,edited_by,edited_at')
      .order('entry_date', { ascending:true });
    if(fromDate) q = q.gte('entry_date', fromDate);
    if(toDate) q = q.lte('entry_date', toDate);
    const res = await q.range(from, from + pageSize - 1);
    if(res.error) throw res.error;
    const rows = res.data || [];
    all = all.concat(rows);
    if(rows.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

// Merge newly-fetched rows into the in-memory cache and rebuild the
// per-item/area index, keeping each bucket sorted by entry_date (balanceAsOf
// relies on that order). Dedupes by row id in case of any range overlap.
function mergeLedgerRows_(rows){
  if(!rows || rows.length === 0) return;
  // Upsert by id: a re-fetched row (e.g. after a grid edit cascades new
  // balances forward through later dates) must overwrite the stale cached
  // copy, not be skipped because that id was already seen.
  const byId = new Map(allLedgerFlat.map(e => [e.id, e]));
  rows.forEach(r => byId.set(r.id, r));
  allLedgerFlat = Array.from(byId.values());
  ledgerByKey = {};
  allLedgerFlat.forEach(e => {
    const k = ledgerKey(e.item_id, e.area_id);
    (ledgerByKey[k] = ledgerByKey[k] || []).push(e);
  });
  Object.values(ledgerByKey).forEach(arr => arr.sort((a,b) => a.entry_date.localeCompare(b.entry_date)));
}

// Widen the loaded window backward if a report asks for a date earlier than
// what's currently in memory. Returns true if it actually fetched anything
// (callers use that to show a brief loading state). No-op if the requested
// date is already covered.
async function ensureLedgerFrom(neededDate){
  if(!neededDate) return false;
  if(ledgerLoadedFrom && neededDate >= ledgerLoadedFrom) return false;
  const toDate = ledgerLoadedFrom ? addDaysISO(ledgerLoadedFrom, -1) : null;
  const rows = await fetchLedgerRowsInRange_(neededDate, toDate);
  mergeLedgerRows_(rows);
  ledgerLoadedFrom = neededDate;
  return true;
}

async function loadAll(){
  // Keep whatever window is already loaded (a report may have expanded it
  // backward already) — never shrink coverage on a routine reload.
  const defaultCutoff = addDaysISO(viewDate, -LEDGER_WINDOW_DAYS);
  const cutoff = (ledgerLoadedFrom && ledgerLoadedFrom < defaultCutoff) ? ledgerLoadedFrom : defaultCutoff;

  const [areasRes, suppliersRes, itemsRes, itemAreasRes, ledgerRows] = await Promise.all([
    sb.from('areas').select('*').order('code'),
    sb.from('suppliers').select('*').order('code'),
    sb.from('items').select('*').eq('is_active', true).order('name'),
    sb.from('item_areas').select('*'),
    fetchLedgerRowsInRange_(cutoff, null),
  ]);
  if(areasRes.error) throw areasRes.error;
  if(suppliersRes.error) throw suppliersRes.error;
  if(itemsRes.error) throw itemsRes.error;
  if(itemAreasRes.error) throw itemAreasRes.error;

  areas = areasRes.data;
  suppliers = suppliersRes.data;
  const areaSetByItem = {};
  (itemAreasRes.data||[]).forEach(r => {
    if(!areaSetByItem[r.item_id]) areaSetByItem[r.item_id] = new Set();
    areaSetByItem[r.item_id].add(r.area_id);
  });
  items = (itemsRes.data||[]).map(i => ({...i, areaIds: areaSetByItem[i.id] || new Set()}));

  ledgerByKey = {};
  allLedgerFlat = ledgerRows || [];
  allLedgerFlat.forEach(e => {
    const k = ledgerKey(e.item_id, e.area_id);
    (ledgerByKey[k] = ledgerByKey[k] || []).push(e);
  });
  Object.values(ledgerByKey).forEach(arr => arr.sort((a,b) => a.entry_date.localeCompare(b.entry_date)));
  ledgerLoadedFrom = cutoff;

  if(!activeAreaCode && areas.length) activeAreaCode = areas[0].code;
}

async function loadAlerts(){
  const [lowRes, expRes] = await Promise.all([
    sb.from('v_low_stock').select('*'),
    sb.from('v_expiring_lots').select('*'),
  ]);
  const low = lowRes.error ? [] : (lowRes.data||[]);
  const exp = expRes.error ? [] : (expRes.data||[]);
  document.getElementById('lowStockCount').style.display = low.length ? '' : 'none';
  document.getElementById('lowStockCount').textContent = low.length;
  document.getElementById('expiringCount').style.display = exp.length ? '' : 'none';
  document.getElementById('expiringCount').textContent = exp.length;
  window.__lowStock = low;
  window.__expiring = exp;
}

async function boot(){
  document.getElementById('loggedInAs').innerHTML = `<i class="ti ti-user-circle" aria-hidden="true"></i> ${escapeHtml((await sb.auth.getUser()).data.user?.email || '')}`;
  document.getElementById('viewDate').value = viewDate;
  try{
    await loadAll();
    await loadAlerts();
    renderAreaTabs();
    renderList();
    document.getElementById('dashboardPanel').style.display = '';
    renderDashboardPanel();
  }catch(e){
    console.error(e);
    showToast('Failed to load data: ' + (e.message||e));
  }
}
function refreshOpenPanels(){
  if(document.getElementById('dashboardPanel').style.display !== 'none') renderDashboardPanel();
  if(document.getElementById('searchPanel').style.display !== 'none') renderSearchResults();
}

document.getElementById('viewDate').addEventListener('change', async (e)=>{
  viewDate = e.target.value || todayISO();
  await ensureLedgerFrom(viewDate); // in case they jump to a date older than the loaded window
  renderList();
  refreshOpenPanels();
});

function renderAreaTabs(){
  const wrap = document.getElementById('areaTabs');
  wrap.innerHTML = areas.map(a =>
    `<button class="area-tab ${a.code===activeAreaCode?'active':''}" data-code="${escapeHtml(a.code)}">${escapeHtml(a.code)}</button>`
  ).join('');
}
document.getElementById('areaTabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.area-tab'); if(!btn) return;
  activeAreaCode = btn.dataset.code;
  renderAreaTabs();
  renderList();
});

function statusOf(item, balance){
  const thr = item.reorder_threshold;
  if(thr == null) return 'ok';
  if(balance <= thr*0.5) return 'crit';
  if(balance <= thr) return 'warn';
  return 'ok';
}

function sourceOptionsHtml(currentAreaCode, selected){
  const opts = [];
  opts.push(`<option value="">— choose —</option>`);
  suppliers.forEach(s => opts.push(`<option value="${escapeHtml(s.code)}" ${selected===s.code?'selected':''}>${escapeHtml(s.code)} (supplier)</option>`));
  areas.filter(a=>a.code!==currentAreaCode).forEach(a => opts.push(`<option value="${escapeHtml(a.code)}" ${selected===a.code?'selected':''}>${escapeHtml(a.code)} (internal)</option>`));
  return opts.join('');
}

function destAreaOptionsHtml(currentAreaCode){
  return areas.filter(a=>a.code!==currentAreaCode).map(a => `<option value="${escapeHtml(a.code)}">${escapeHtml(a.code)}</option>`).join('');
}

const WRITE_OFF_REASONS = ['Expired','Damaged','Pull-out','Out of QC'];

function renderList(){
  document.getElementById('dateLabel').textContent = new Date(viewDate+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const list = document.getElementById('list');
  const empty = document.getElementById('emptyState');
  const area = areas.find(a => a.code === activeAreaCode);
  if(!area){ list.innerHTML=''; empty.style.display='block'; return; }

  const areaItems = items.filter(i => i.areaIds.has(area.id)).sort((a,b)=>a.name.localeCompare(b.name));
  if(areaItems.length === 0){ list.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';

  list.innerHTML = areaItems.map(item => renderCard(item, area)).join('');
}

function renderCard(item, area, showAreaBadge){
  const bal = balanceAsOf(item.id, area.id, viewDate);
  const st = statusOf(item, bal);
  const today = entryOnDate(item.id, area.id, viewDate);
  const supplierCode = today && today.source_code ? today.source_code : '';
  let todayLine = 'No entry logged for this date yet.';
  if(today){
    const parts = [];
    if(today.in_qty) parts.push(`+${fmt(today.in_qty)} in${today.source_code ? ' from '+escapeHtml(today.source_code) : ''}`);
    if(today.out_qty) parts.push(`−${fmt(today.out_qty)} out`);
    if(today.write_off_qty) parts.push(`−${fmt(today.write_off_qty)} write-off (${escapeHtml(today.write_off_reason||'')})`);
    if(today.transfer_qty) parts.push(`−${fmt(today.transfer_qty)} xfer → ${escapeHtml(today.transfer_to_code||'')}`);
    todayLine = (parts.length ? parts.join(' · ') : 'Balance carried, no movement') +
      ` · <span class="status-tag ${today.sync_status}">${today.sync_status}</span>` +
      (today.edited_by ? ` · by ${escapeHtml(today.edited_by)}` : '');
  }
  const pct = item.reorder_threshold ? Math.min(100, (bal / (item.reorder_threshold*2)) * 100) : (bal>0 ? 100 : 0);
  return `
  <div class="card ${st}" data-item="${item.id}" data-area="${area.id}" data-areacode="${escapeHtml(area.code)}">
    <div class="card-top">
      <div class="card-main">
        <div class="card-name">${escapeHtml(item.name)}${showAreaBadge ? ` <span class="status-tag" style="background:var(--panel2);color:var(--text-dim);border:1px solid var(--line-soft);">${escapeHtml(area.code)}</span>` : ''}</div>
        <div class="card-meta">
          <span>${fmt(bal)} ${escapeHtml(item.unit_of_measure||'')} on hand</span>
          ${item.reorder_threshold!=null?`<span>· reorder at ${fmt(item.reorder_threshold)}</span>`:''}
          <span class="status-tag ${st}">${st==='ok'?'OK':st==='warn'?'Low':'Critical'}</span>
        </div>
      </div>
      <div class="gauge-wrap"><div class="gauge"><div class="gauge-fill ${st}" style="width:${pct}%;"></div></div></div>
      <div class="card-actions">
        <button class="small" data-act="receive"><i class="ti ti-arrow-down-circle" aria-hidden="true"></i>Receive</button>
        <button class="small" data-act="use"><i class="ti ti-minus" aria-hidden="true"></i>Use</button>
        <button class="small" data-act="writeoff"><i class="ti ti-trash" aria-hidden="true"></i>Write off</button>
        <button class="small" data-act="transfer"><i class="ti ti-arrows-right-left" aria-hidden="true"></i>Transfer</button>
      </div>
    </div>
    <div class="today-line">${todayLine}</div>

    <div class="action-panel" data-panel="receive">
      <div class="err-msg" data-err></div>
      <div class="fld"><label>Qty</label><input type="number" min="0" step="0.01" data-f="qty"></div>
      <div class="fld"><label>Source</label><select data-f="source">${sourceOptionsHtml(area.code, supplierCode)}</select></div>
      <div class="fld"><label>Lot # (optional)</label><input type="text" data-f="lot"></div>
      <div class="fld"><label>Expiry (optional)</label><input type="date" data-f="expiry"></div>
      <div class="fld"><label>Manufacturer (optional)</label><input type="text" data-f="mfr"></div>
      <button data-act="cancel"><i class="ti ti-x" aria-hidden="true"></i>Cancel</button>
      <button class="primary" data-act="confirm-receive"><i class="ti ti-check" aria-hidden="true"></i>Confirm receive</button>
    </div>

    <div class="action-panel" data-panel="use">
      <div class="err-msg" data-err></div>
      <div class="fld"><label>Qty</label><input type="number" min="0" step="0.01" data-f="qty"></div>
      <button data-act="cancel"><i class="ti ti-x" aria-hidden="true"></i>Cancel</button>
      <button class="primary" data-act="confirm-use"><i class="ti ti-check" aria-hidden="true"></i>Confirm use</button>
    </div>

    <div class="action-panel" data-panel="writeoff">
      <div class="err-msg" data-err></div>
      <div class="fld"><label>Qty</label><input type="number" min="0" step="0.01" data-f="qty"></div>
      <div class="fld"><label>Reason</label><select data-f="reason">${WRITE_OFF_REASONS.map(r=>`<option value="${r}">${r}</option>`).join('')}</select></div>
      <div class="fld"><label>Lot # (optional)</label><input type="text" data-f="lot"></div>
      <div class="fld"><label>Expiry (optional)</label><input type="date" data-f="expiry"></div>
      <div class="fld"><label>Manufacturer (optional)</label><input type="text" data-f="mfr"></div>
      <div class="fld"><label>Disposal method</label>
        <select data-f="disposal">
          <option value="">—</option>
          <option value="Biohazard">Biohazard</option>
          <option value="Chemical Waste">Chemical Waste</option>
          <option value="Sink">Sink</option>
          <option value="Puncture-proof container">Puncture-proof container</option>
        </select>
      </div>
      <button data-act="cancel"><i class="ti ti-x" aria-hidden="true"></i>Cancel</button>
      <button class="primary" data-act="confirm-writeoff"><i class="ti ti-check" aria-hidden="true"></i>Confirm write-off</button>
    </div>

    <div class="action-panel" data-panel="transfer">
      <div class="err-msg" data-err></div>
      <div class="fld"><label>Qty</label><input type="number" min="0" step="0.01" data-f="qty"></div>
      <div class="fld"><label>To area</label><select data-f="dest">${destAreaOptionsHtml(area.code)}</select></div>
      <button data-act="cancel"><i class="ti ti-x" aria-hidden="true"></i>Cancel</button>
      <button class="primary" data-act="confirm-transfer"><i class="ti ti-check" aria-hidden="true"></i>Confirm transfer</button>
    </div>
  </div>`;
}

async function callLedgerAction(body){
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/ledger-action`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization': `Bearer ${session.access_token}` },
    body: JSON.stringify(body),
  });
  const json = await res.json().catch(()=>({}));
  if(!res.ok || json.error) throw new Error(json.error || `Request failed (${res.status})`);
  return json;
}

document.getElementById('app').addEventListener('click', async (e)=>{
  const card = e.target.closest('.card'); if(!card) return;
  const act = e.target.closest('[data-act]')?.dataset.act;
  if(!act) return;
  const itemId = card.dataset.item;
  const areaCode = card.dataset.areacode;
  const item = items.find(i => i.id === itemId);

  if(act === 'receive' || act === 'use' || act === 'writeoff' || act === 'transfer'){
    card.querySelectorAll('.action-panel').forEach(p => { if(p.dataset.panel !== act) p.classList.remove('open'); });
    card.querySelector(`[data-panel="${act}"]`).classList.toggle('open');
    return;
  }
  if(act === 'cancel'){
    e.target.closest('.action-panel').classList.remove('open');
    return;
  }

  const panel = e.target.closest('.action-panel');
  const errEl = panel.querySelector('[data-err]');
  errEl.style.display='none';
  const get = f => panel.querySelector(`[data-f="${f}"]`)?.value?.trim() || '';

  try{
    if(act === 'confirm-receive'){
      const qty = parseFloat(get('qty'));
      const source = get('source');
      if(!qty || qty<=0){ throw new Error('Enter a quantity greater than 0.'); }
      if(!source){ throw new Error('Choose a source.'); }
      await callLedgerAction({
        action:'receive', area_code:areaCode, item_name:item.name, qty, entry_date:viewDate,
        source_code:source, lot_number:get('lot')||undefined, expiry_date:get('expiry')||undefined, manufacturer:get('mfr')||undefined,
      });
      showToast(`Received ${fmt(qty)} ${item.unit_of_measure||''} of ${item.name}`);
    }else if(act === 'confirm-use'){
      const qty = parseFloat(get('qty'));
      if(!qty || qty<=0){ throw new Error('Enter a quantity greater than 0.'); }
      await callLedgerAction({ action:'use', area_code:areaCode, item_name:item.name, qty, entry_date:viewDate });
      showToast(`Used ${fmt(qty)} ${item.unit_of_measure||''} of ${item.name}`);
    }else if(act === 'confirm-writeoff'){
      const qty = parseFloat(get('qty'));
      const reason = get('reason');
      if(!qty || qty<=0){ throw new Error('Enter a quantity greater than 0.'); }
      if(!reason){ throw new Error('Choose a reason.'); }
      await callLedgerAction({
        action:'write_off', area_code:areaCode, item_name:item.name, qty, entry_date:viewDate,
        write_off_reason:reason, lot_number:get('lot')||undefined, expiry_date:get('expiry')||undefined,
        manufacturer:get('mfr')||undefined, disposal_method:get('disposal')||undefined,
      });
      showToast(`Wrote off ${fmt(qty)} ${item.unit_of_measure||''} of ${item.name} — ${reason}`);
    }else if(act === 'confirm-transfer'){
      const qty = parseFloat(get('qty'));
      const dest = get('dest');
      if(!qty || qty<=0){ throw new Error('Enter a quantity greater than 0.'); }
      if(!dest){ throw new Error('Choose a destination area.'); }
      await callLedgerAction({ action:'transfer', area_code:areaCode, item_name:item.name, qty, entry_date:viewDate, destination_area_code:dest });
      showToast(`Transferred ${fmt(qty)} ${item.unit_of_measure||''} of ${item.name} to ${dest}`);
    }else{
      return;
    }
    panel.classList.remove('open');
    await loadAll();
    await loadAlerts();
    renderList();
    refreshOpenPanels();
  }catch(err){
    errEl.textContent = err.message || String(err);
    errEl.style.display='block';
  }
});

// ---- Panel toggling (shared) ----
const ALL_PANEL_IDS = ['dashboardPanel','searchPanel','lowStockPanel','expiringPanel','itemsPanel','disposalPanel','reportsPanel','gridPanel'];
function togglePanel(id, renderFn){
  const p = document.getElementById(id);
  const willOpen = p.style.display === 'none';
  ALL_PANEL_IDS.forEach(pid => { if(pid !== id) document.getElementById(pid).style.display = 'none'; });
  p.style.display = willOpen ? '' : 'none';
  if(willOpen) renderFn();
}

// ---- Dashboard ----
document.getElementById('btnDashboard').addEventListener('click', ()=> togglePanel('dashboardPanel', renderDashboardPanel));

function renderDashboardPanel(){
  const p = document.getElementById('dashboardPanel');
  const head = `<div class="panel-head"><span class="panel-title"><i class="ti ti-layout-dashboard" aria-hidden="true" style="margin-right:6px;"></i>Dashboard</span><button class="panel-close" data-close>&times;</button></div>`;

  const low = window.__lowStock || [];
  const exp = window.__expiring || [];
  const critLow = low.filter(r => r.reorder_threshold != null && r.balance <= r.reorder_threshold*0.5).length;
  const warnLow = low.length - critLow;
  const critExp = exp.filter(r => r.days_until_expiry <= 7).length;

  const todayEntries = allLedgerFlat.filter(e => e.entry_date === viewDate && (e.in_qty||e.out_qty||e.write_off_qty||e.transfer_qty));
  let todayIn=0, todayOut=0, todayWo=0, todayXf=0;
  todayEntries.forEach(e => {
    todayIn += Number(e.in_qty||0); todayOut += Number(e.out_qty||0);
    todayWo += Number(e.write_off_qty||0); todayXf += Number(e.transfer_qty||0);
  });

  const kpis = `<div class="kpi-row">
    <div class="kpi-tile"><div class="kpi-icon"><i class="ti ti-box" aria-hidden="true"></i></div><div class="kpi-num">${items.length}</div><div class="kpi-label">Items tracked</div></div>
    <div class="kpi-tile"><div class="kpi-icon"><i class="ti ti-alert-triangle" aria-hidden="true"></i></div><div class="kpi-num ${critLow>0?'crit':(warnLow>0?'warn':'ok')}">${low.length}</div><div class="kpi-label">Low / critical stock</div></div>
    <div class="kpi-tile"><div class="kpi-icon"><i class="ti ti-hourglass-low" aria-hidden="true"></i></div><div class="kpi-num ${critExp>0?'crit':(exp.length>0?'warn':'ok')}">${exp.length}</div><div class="kpi-label">Lots expiring ≤30d</div></div>
    <div class="kpi-tile"><div class="kpi-icon"><i class="ti ti-activity" aria-hidden="true"></i></div><div class="kpi-num">${todayEntries.length}</div><div class="kpi-label">Movements today</div></div>
  </div>`;

  // Low-stock items by area — single-hue magnitude bars, direct-labeled.
  const lowByArea = {};
  areas.forEach(a => { lowByArea[a.code] = 0; });
  low.forEach(r => { lowByArea[r.area_code] = (lowByArea[r.area_code]||0) + 1; });
  const maxLow = Math.max(1, ...Object.values(lowByArea));
  const barsHtml = Object.entries(lowByArea).map(([code,count]) => `
    <div class="bar-row">
      <div class="bar-label">${escapeHtml(code)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${count/maxLow*100}%;background:${count>0?'var(--warn)':'var(--line-soft)'};"></div></div>
      <div class="bar-val">${count}</div>
    </div>`).join('');

  // Per-area mini summary: item count + today's movement.
  const acodeById = areaCodeById();
  const areaCards = areas.map(a => {
    const areaItemCount = items.filter(i => i.areaIds.has(a.id)).length;
    const areaLow = lowByArea[a.code] || 0;
    const areaToday = todayEntries.filter(e => e.area_id === a.id);
    let inQ=0, outQ=0;
    areaToday.forEach(e => { inQ += Number(e.in_qty||0); outQ += Number(e.out_qty||0); });
    return `<div class="area-mini-card">
      <h4>${escapeHtml(a.code)}</h4>
      <div class="row"><span>Items tracked</span><span style="font-family:var(--mono);">${areaItemCount}</span></div>
      <div class="row"><span>Low / critical</span><span style="font-family:var(--mono);color:${areaLow>0?'var(--warn)':'var(--text-dim)'};">${areaLow}</span></div>
      <div class="row"><span>Received today</span><span style="font-family:var(--mono);color:var(--ok);">+${fmt(inQ)}</span></div>
      <div class="row"><span>Used today</span><span style="font-family:var(--mono);color:var(--crit);">−${fmt(outQ)}</span></div>
    </div>`;
  }).join('');

  // Recent activity feed across all areas.
  const inameById = itemNameById();
  const recent = allLedgerFlat.filter(e => e.in_qty||e.out_qty||e.write_off_qty||e.transfer_qty)
    .slice().sort((a,b) => b.entry_date.localeCompare(a.entry_date)).slice(0, 8);
  const feedHtml = recent.length === 0 ? `<div class="empty" style="padding:24px;">No activity logged yet.</div>` : `<div class="activity-feed">
    ${recent.map(e => {
      const parts = [];
      if(e.in_qty) parts.push(`+${fmt(e.in_qty)} in`);
      if(e.out_qty) parts.push(`−${fmt(e.out_qty)} out`);
      if(e.write_off_qty) parts.push(`−${fmt(e.write_off_qty)} write-off`);
      if(e.transfer_qty) parts.push(`−${fmt(e.transfer_qty)} xfer`);
      return `<div class="row"><span>${escapeHtml(inameById[e.item_id]||'')} <span class="meta">(${escapeHtml(acodeById[e.area_id]||'')})</span></span><span class="meta">${escapeHtml(e.entry_date)} · ${escapeHtml(parts.join(', '))}</span></div>`;
    }).join('')}
  </div>`;

  p.innerHTML = head + kpis +
    `<div class="dash-section-title">Low stock by area</div>${low.length===0 ? `<div class="empty" style="padding:24px;"><i class="ti ti-circle-check" aria-hidden="true"></i>Nothing below reorder threshold.</div>` : barsHtml}` +
    `<div class="dash-section-title">Area snapshot</div><div class="area-mini-grid">${areaCards}</div>` +
    `<div class="dash-section-title">Recent activity</div>${feedHtml}`;

      .forEach(area => cards.push(renderCard(item, area, true)));

  wrap.innerHTML = `<div style="font-size:11px;color:var(--text-faint);margin-bottom:10px;">${matches.length} item${matches.length===1?'':'s'} matched · ${cards.length} area result${cards.length===1?'':'s'}</div>` + cards.join('');
}

async function createItem(){
  const errEl = document.getElementById('newItemErr');
  errEl.style.display='none';
  const name = document.getElementById('newItemName').value.trim();
  const unit = document.getElementById('newItemUnit').value.trim();
  const isConsumable = document.getElementById('newItemConsumable').value === 'true';
  const thresholdRaw = document.getElementById('newItemThreshold').value;
  const threshold = thresholdRaw === '' ? null : parseFloat(thresholdRaw);
  const supplierId = document.getElementById('newItemSupplier').value || null;
  const areaIds = Array.from(document.querySelectorAll('.new-item-area:checked')).map(el => el.value);
  if(!name){ errEl.textContent='Name is required.'; errEl.style.display='block'; return; }
  try{
    const { data: newItem, error } = await sb.from('items').insert({
      name, unit_of_measure: unit || null, is_consumable: isConsumable,
      reorder_threshold: threshold, default_supplier_id: supplierId,
    }).select().single();
    if(error) throw error;
    if(areaIds.length){
      const { error: iaErr } = await sb.from('item_areas').insert(areaIds.map(area_id => ({ item_id:newItem.id, area_id })));
      if(iaErr) throw iaErr;
    }
    showToast(`Added ${name}`);
    await loadAll();
    renderItemsPanel();
    renderList();
    refreshOpenPanels();
  }catch(e){
    errEl.textContent = e.message || String(e);
    errEl.style.display='block';
  }
}

async function saveItemRow(row){
  const id = row.dataset.id;
  const item = items.find(i => i.id === id);
  const name = row.querySelector('[data-f="name"]').value.trim();
  const unit = row.querySelector('[data-f="unit"]').value.trim();
  const isConsumable = row.querySelector('[data-f="consumable"]').value === 'true';
  const thresholdRaw = row.querySelector('[data-f="threshold"]').value;
  const threshold = thresholdRaw === '' ? null : parseFloat(thresholdRaw);
  const supplierId = row.querySelector('[data-f="supplier"]').value || null;
  const checkedAreaIds = Array.from(row.querySelectorAll('[data-f="area"]:checked')).map(el => el.dataset.area);
  try{
    const { error } = await sb.from('items').update({
      name, unit_of_measure: unit || null, is_consumable: isConsumable,
      reorder_threshold: threshold, default_supplier_id: supplierId,
    }).eq('id', id);
    if(error) throw error;

    const currentAreaIds = Array.from(item.areaIds);
    const toAdd = checkedAreaIds.filter(a => !item.areaIds.has(a));
    const toRemove = currentAreaIds.filter(a => !checkedAreaIds.includes(a));
    if(toAdd.length){
      const { error: addErr } = await sb.from('item_areas').insert(toAdd.map(area_id => ({ item_id:id, area_id })));
      if(addErr) throw addErr;
    }
    if(toRemove.length){
      const { error: rmErr } = await sb.from('item_areas').delete().eq('item_id', id).in('area_id', toRemove);
      if(rmErr) throw rmErr;
    }
    showToast(`Saved ${name}`);
    await loadAll();
    renderItemsPanel();
    renderList();
    refreshOpenPanels();
  }catch(e){
    showToast('Save failed: ' + (e.message||e));
  }
}

async function archiveItemRow(row){
  const id = row.dataset.id;
  const item = items.find(i => i.id === id);
  if(!confirm(`Archive "${item.name}"? It will be hidden from new entries but past records stay intact.`)) return;
  try{
    const { error } = await sb.from('items').update({ is_active:false }).eq('id', id);
    if(error) throw error;
    showToast(`Archived ${item.name}`);
    await loadAll();
    renderItemsPanel();
    renderList();
    refreshOpenPanels();
  }catch(e){
    showToast('Archive failed: ' + (e.message||e));
  }
}

function dayBefore(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() - 1);
  const tz = d.getTimezoneOffset()*60000;
  return new Date(d.getTime()-tz).toISOString().slice(0,10);
}

// Reports only keep a rolling window of ledger history in memory by
// default (see LEDGER_WINDOW_DAYS) — this expands it backward on demand
// when a report's own date filter reaches further back, showing a brief
// loading placeholder only when a fetch actually happens.
async function ensureReportRange_(body, neededDate){
  if(!neededDate) return;
  if(ledgerLoadedFrom && neededDate >= ledgerLoadedFrom) return; // already covered, no flicker
  body.innerHTML = `<div class="empty">Loading history…</div>`;
  await ensureLedgerFrom(neededDate);
}

// 1. Remaining balance — combined balance per item as of a chosen date, optionally filtered to one area.
async function renderBalanceReport(body){
  await ensureReportRange_(body, reportState.balanceDate || viewDate);
  const areaOpts = `<option value="">All areas</option>` + areas.map(a=>`<option value="${a.id}" ${reportState.balanceArea===a.id?'selected':''}>${escapeHtml(a.code)}</option>`).join('');
  const sourceOpts = `<option value="">All sources</option>` + suppliers.map(s=>`<option value="${escapeHtml(s.code)}" ${reportState.balanceSource===s.code?'selected':''}>${escapeHtml(s.code)}</option>`).join('');
  const filterRow = `<div class="filter-row">
    <label>As of<input type="date" id="rbDate" value="${reportState.balanceDate}"></label>
    <label>Area<select id="rbArea">${areaOpts}</select></label>
    <label>Source (default supplier)<select id="rbSource">${sourceOpts}</select></label>
  </div>`;

  const rows = items.filter(item => !reportState.balanceSource || supplierCodeOfItem(item) === reportState.balanceSource)
    .map(item => {
    const areaIds = reportState.balanceArea ? [reportState.balanceArea].filter(id => item.areaIds.has(id)) : Array.from(item.areaIds);
    if(areaIds.length === 0) return null;
    const byArea = {};
    let total = 0;
    areaIds.forEach(aid => {
      const bal = balanceAsOf(item.id, aid, reportState.balanceDate);
      byArea[areaCodeById()[aid]] = bal;
      total = Math.round((total + bal)*100)/100;
    });
    return { item, byArea, total };
  }).filter(Boolean).sort((a,b) => a.item.name.localeCompare(b.item.name));

  const table = rows.length === 0 ? `<div class="empty">No items to show.</div>` : `<table><thead><tr><th>Item</th><th>By area</th><th class="num">Combined balance</th></tr></thead><tbody>
    ${rows.map(r => {
      const st = statusOf(r.item, r.total);
      const breakdown = Object.entries(r.byArea).map(([a,q])=>`${escapeHtml(a)}: ${fmt(q)}`).join(' · ');
      return `<tr><td>${escapeHtml(r.item.name)}</td><td class="breakdown">${breakdown}</td><td class="num"><span class="status-tag ${st}">${fmt(r.total)} ${escapeHtml(r.item.unit_of_measure||'')}</span></td></tr>`;
    }).join('')}
  </tbody></table>`;

  setPrintHead(`As of ${reportState.balanceDate}${reportState.balanceArea ? ' · Area: '+areaCodeById()[reportState.balanceArea] : ''}${reportState.balanceSource ? ' · Source: '+reportState.balanceSource : ''}`);
  body.innerHTML = filterRow + table;
  document.getElementById('rbDate').addEventListener('change', (e)=>{ reportState.balanceDate = e.target.value; renderBalanceReport(body); });
  document.getElementById('rbArea').addEventListener('change', (e)=>{ reportState.balanceArea = e.target.value; renderBalanceReport(body); });
  document.getElementById('rbSource').addEventListener('change', (e)=>{ reportState.balanceSource = e.target.value; renderBalanceReport(body); });
}

// 2. Usage & received report — totals per item over a date range, split by movement kind, plus received-by-source.
async function renderActivityReport(body){
  if(reportState.actFrom) await ensureReportRange_(body, reportState.actFrom);
  const areaOpts = `<option value="">All areas</option>` + areas.map(a=>`<option value="${a.id}" ${reportState.actArea===a.id?'selected':''}>${escapeHtml(a.code)}</option>`).join('');
  const itemOpts = `<option value="">All items</option>` + items.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<option value="${i.id}" ${reportState.actItem===i.id?'selected':''}>${escapeHtml(i.name)}</option>`).join('');
  const filterRow = `<div class="filter-row">
    <label>From<input type="date" id="actFrom" value="${reportState.actFrom}"></label>
    <label>To<input type="date" id="actTo" value="${reportState.actTo}"></label>
    <label>Area<select id="actArea">${areaOpts}</select></label>
    <label>Item<select id="actItem">${itemOpts}</select></label>
  </div>`;

  const supCodes = supplierCodeSet();
  const inameById = itemNameById(), unitById = itemUnitById();
  const entries = allLedgerFlat.filter(e =>
    (!reportState.actFrom || e.entry_date >= reportState.actFrom) &&
    (!reportState.actTo || e.entry_date <= reportState.actTo) &&
    (!reportState.actArea || e.area_id === reportState.actArea) &&
    (!reportState.actItem || e.item_id === reportState.actItem)
  );

  const byItem = {};
  const bySource = {};
  entries.forEach(e => {
    const key = e.item_id;
    if(!byItem[key]) byItem[key] = { received:0, transferIn:0, used:0, writeoff:0, transferOut:0 };
    const r = byItem[key];
    if(e.in_qty){
      if(e.source_code && supCodes.has(e.source_code)){
        r.received = Math.round((r.received + Number(e.in_qty))*100)/100;
        if(!bySource[e.source_code]) bySource[e.source_code] = 0;
        bySource[e.source_code] = Math.round((bySource[e.source_code] + Number(e.in_qty))*100)/100;
      }else{
        r.transferIn = Math.round((r.transferIn + Number(e.in_qty))*100)/100;
      }
    }
    if(e.out_qty) r.used = Math.round((r.used + Number(e.out_qty))*100)/100;
    if(e.write_off_qty) r.writeoff = Math.round((r.writeoff + Number(e.write_off_qty))*100)/100;
    if(e.transfer_qty) r.transferOut = Math.round((r.transferOut + Number(e.transfer_qty))*100)/100;
  });

  const rows = Object.entries(byItem).map(([itemId, r]) => ({ itemId, name: inameById[itemId]||itemId, unit: unitById[itemId]||'', ...r }))
    .sort((a,b)=>a.name.localeCompare(b.name));

  const mainTable = rows.length === 0 ? `<div class="empty">No activity in this range.</div>` : `<table><thead><tr>
      <th>Item</th><th class="num">Received</th><th class="num">Transfer in</th><th class="num">Used</th><th class="num">Write-off</th><th class="num">Transfer out</th>
    </tr></thead><tbody>
      ${rows.map(r => `<tr>
        <td>${escapeHtml(r.name)}</td>
        <td class="num">${fmt(r.received)} ${escapeHtml(r.unit)}</td>
        <td class="num">${fmt(r.transferIn)} ${escapeHtml(r.unit)}</td>
        <td class="num">${fmt(r.used)} ${escapeHtml(r.unit)}</td>
        <td class="num">${fmt(r.writeoff)} ${escapeHtml(r.unit)}</td>
        <td class="num">${fmt(r.transferOut)} ${escapeHtml(r.unit)}</td>
      </tr>`).join('')}
    </tbody></table>`;

  const sourceRows = Object.entries(bySource).sort((a,b)=>b[1]-a[1]);
  const sourceTable = sourceRows.length === 0 ? '' : `<div style="font-size:12px;color:var(--text-dim);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.4px;">Received by supplier</div>
    <table><thead><tr><th>Supplier</th><th class="num">Total received</th></tr></thead><tbody>
      ${sourceRows.map(([code,total]) => `<tr><td>${escapeHtml(code)}</td><td class="num">${fmt(total)}</td></tr>`).join('')}
    </tbody></table>`;

  setPrintHead(`${reportState.actFrom||'earliest'} – ${reportState.actTo||'latest'}${reportState.actArea ? ' · Area: '+areaCodeById()[reportState.actArea] : ''}${reportState.actItem ? ' · Item: '+inameById[reportState.actItem] : ''}`);
  body.innerHTML = filterRow + mainTable + sourceTable;
  document.getElementById('actFrom').addEventListener('change', (e)=>{ reportState.actFrom = e.target.value; renderActivityReport(body); });
  document.getElementById('actTo').addEventListener('change', (e)=>{ reportState.actTo = e.target.value; renderActivityReport(body); });
  document.getElementById('actArea').addEventListener('change', (e)=>{ reportState.actArea = e.target.value; renderActivityReport(body); });
  document.getElementById('actItem').addEventListener('change', (e)=>{ reportState.actItem = e.target.value; renderActivityReport(body); });
}

// 3. Daily entry log — raw ledger rows for a date range, newest first.
async function renderDailyLogReport(body){
  await ensureReportRange_(body, reportState.logFrom || viewDate);
  const areaOpts = `<option value="">All areas</option>` + areas.map(a=>`<option value="${a.id}" ${reportState.logArea===a.id?'selected':''}>${escapeHtml(a.code)}</option>`).join('');
  const filterRow = `<div class="filter-row">
    <label>From<input type="date" id="logFrom" value="${reportState.logFrom}"></label>
    <label>To<input type="date" id="logTo" value="${reportState.logTo}"></label>
    <label>Area<select id="logArea">${areaOpts}</select></label>
  </div>`;

  const inameById = itemNameById(), acodeById = areaCodeById();
  let rows = allLedgerFlat.filter(e =>
    (!reportState.logFrom || e.entry_date >= reportState.logFrom) &&
    (!reportState.logTo || e.entry_date <= reportState.logTo) &&
    (!reportState.logArea || e.area_id === reportState.logArea) &&
    (e.in_qty || e.out_qty || e.write_off_qty || e.transfer_qty)
  ).sort((a,b) => b.entry_date.localeCompare(a.entry_date) || (inameById[a.item_id]||'').localeCompare(inameById[b.item_id]||''));
  const truncated = rows.length > 500;

  const table = rows.length === 0 ? `<div class="empty">No entries in this range.</div>` : `<table><thead><tr>
      <th>Date</th><th>Area</th><th>Item</th><th class="num">In</th><th>Source</th><th class="num">Out</th>
      <th class="num">Write-off</th><th>Reason</th><th class="num">Xfer</th><th>Xfer to</th><th>Status</th><th>By</th>
    </tr></thead><tbody>
      ${rows.map(e => `<tr>
        <td>${escapeHtml(e.entry_date)}</td>
        <td>${escapeHtml(acodeById[e.area_id]||'')}</td>
        <td>${escapeHtml(inameById[e.item_id]||'')}</td>
        <td class="num">${e.in_qty ? fmt(e.in_qty) : '—'}</td>
        <td>${escapeHtml(e.source_code||'—')}</td>
        <td class="num">${e.out_qty ? fmt(e.out_qty) : '—'}</td>
        <td class="num">${e.write_off_qty ? fmt(e.write_off_qty) : '—'}</td>
        <td>${escapeHtml(e.write_off_reason||'—')}</td>
        <td class="num">${e.transfer_qty ? fmt(e.transfer_qty) : '—'}</td>
        <td>${escapeHtml(e.transfer_to_code||'—')}</td>
        <td><span class="status-tag ${e.sync_status}">${escapeHtml(e.sync_status)}</span></td>
        <td>${escapeHtml(e.edited_by||'—')}</td>
      </tr>`).join('')}
    </tbody></table>${truncated ? `<div style="font-size:11px;color:var(--text-faint);margin-top:8px;">Showing the most recent 500 rows — narrow the date range to see the rest.</div>` : ''}`;

  setPrintHead(`${reportState.logFrom||'earliest'} – ${reportState.logTo||'latest'}${reportState.logArea ? ' · Area: '+acodeById[reportState.logArea] : ''}`);
  body.innerHTML = filterRow + table;
  document.getElementById('logFrom').addEventListener('change', (e)=>{ reportState.logFrom = e.target.value; renderDailyLogReport(body); });
  document.getElementById('logTo').addEventListener('change', (e)=>{ reportState.logTo = e.target.value; renderDailyLogReport(body); });
  document.getElementById('logArea').addEventListener('change', (e)=>{ reportState.logArea = e.target.value; renderDailyLogReport(body); });
}

// 4. Restock report — receipts from external suppliers only (internal transfers are excluded; see Usage & received for those).
async function renderRestockReport(body){
  if(reportState.restockFrom) await ensureReportRange_(body, reportState.restockFrom);
  const areaOpts = `<option value="">All areas</option>` + areas.map(a=>`<option value="${a.id}" ${reportState.restockArea===a.id?'selected':''}>${escapeHtml(a.code)}</option>`).join('');
  const itemOpts = `<option value="">All items</option>` + items.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<option value="${i.id}" ${reportState.restockItem===i.id?'selected':''}>${escapeHtml(i.name)}</option>`).join('');
  const sourceOpts = `<option value="">All sources</option>` + suppliers.map(s=>`<option value="${escapeHtml(s.code)}" ${reportState.restockSource===s.code?'selected':''}>${escapeHtml(s.code)}</option>`).join('');
  const filterRow = `<div class="filter-row">
    <label>From<input type="date" id="rsFrom" value="${reportState.restockFrom}"></label>
    <label>To<input type="date" id="rsTo" value="${reportState.restockTo}"></label>
    <label>Area<select id="rsArea">${areaOpts}</select></label>
    <label>Item<select id="rsItem">${itemOpts}</select></label>
    <label>Source<select id="rsSource">${sourceOpts}</select></label>
  </div>
  <div style="font-size:11px;color:var(--text-faint);margin-bottom:10px;">Receipts from suppliers only — internal area-to-area transfers show under Usage &amp; received as "Transfer in".</div>`;

  const supCodes = supplierCodeSet();
  const inameById = itemNameById(), unitById = itemUnitById(), acodeById = areaCodeById();
  const entries = allLedgerFlat.filter(e =>
    e.in_qty && e.source_code && supCodes.has(e.source_code) &&
    (!reportState.restockFrom || e.entry_date >= reportState.restockFrom) &&
    (!reportState.restockTo || e.entry_date <= reportState.restockTo) &&
    (!reportState.restockArea || e.area_id === reportState.restockArea) &&
    (!reportState.restockItem || e.item_id === reportState.restockItem) &&
    (!reportState.restockSource || e.source_code === reportState.restockSource)
  );

  const byItem = {};
  entries.forEach(e => {
    if(!byItem[e.item_id]) byItem[e.item_id] = { total:0, bySource:{}, byArea:{} };
    const r = byItem[e.item_id];
    r.total = Math.round((r.total + Number(e.in_qty))*100)/100;
    r.bySource[e.source_code] = Math.round(((r.bySource[e.source_code]||0) + Number(e.in_qty))*100)/100;
    const ac = acodeById[e.area_id];
    r.byArea[ac] = Math.round(((r.byArea[ac]||0) + Number(e.in_qty))*100)/100;
  });
  const rows = Object.entries(byItem).map(([id,r]) => ({ id, name: inameById[id]||id, unit: unitById[id]||'', ...r })).sort((a,b)=>b.total-a.total);

  const table = rows.length === 0 ? `<div class="empty">No restocks in this range.</div>` : `<table><thead><tr>
      <th>Item</th><th>By area</th><th>By supplier</th><th class="num">Total received</th>
    </tr></thead><tbody>
      ${rows.map(r => `<tr>
        <td>${escapeHtml(r.name)}</td>
        <td class="breakdown">${Object.entries(r.byArea).map(([a,q])=>`${escapeHtml(a)}: ${fmt(q)}`).join(' · ')}</td>
        <td class="breakdown">${Object.entries(r.bySource).map(([s,q])=>`${escapeHtml(s)}: ${fmt(q)}`).join(' · ')}</td>
        <td class="num">${fmt(r.total)} ${escapeHtml(r.unit)}</td>
      </tr>`).join('')}
    </tbody></table>`;

  setPrintHead(`${reportState.restockFrom||'earliest'} – ${reportState.restockTo||'latest'}${reportState.restockArea ? ' · Area: '+areaCodeById()[reportState.restockArea] : ''}${reportState.restockSource ? ' · Source: '+reportState.restockSource : ''}`);
  body.innerHTML = filterRow + table;
  document.getElementById('rsFrom').addEventListener('change', (e)=>{ reportState.restockFrom = e.target.value; renderRestockReport(body); });
  document.getElementById('rsTo').addEventListener('change', (e)=>{ reportState.restockTo = e.target.value; renderRestockReport(body); });
  document.getElementById('rsArea').addEventListener('change', (e)=>{ reportState.restockArea = e.target.value; renderRestockReport(body); });
  document.getElementById('rsItem').addEventListener('change', (e)=>{ reportState.restockItem = e.target.value; renderRestockReport(body); });
  document.getElementById('rsSource').addEventListener('change', (e)=>{ reportState.restockSource = e.target.value; renderRestockReport(body); });
}

// 5. Received / used / balance — opening balance, movement, closing balance per item+area over a date range.
async function renderRubReport(body){
  // opening balance looks *before* the From date, so that's the earliest date this report needs loaded
  if(reportState.rubFrom) await ensureReportRange_(body, dayBefore(reportState.rubFrom));
  else await ensureReportRange_(body, reportState.rubTo || viewDate);
  const areaOpts = `<option value="">All areas</option>` + areas.map(a=>`<option value="${a.id}" ${reportState.rubArea===a.id?'selected':''}>${escapeHtml(a.code)}</option>`).join('');
  const filterRow = `<div class="filter-row">
    <label>From<input type="date" id="rubFrom" value="${reportState.rubFrom}"></label>
    <label>To<input type="date" id="rubTo" value="${reportState.rubTo}"></label>
    <label>Area<select id="rubArea">${areaOpts}</select></label>
  </div>`;

  const from = reportState.rubFrom, to = reportState.rubTo || viewDate;
  const rows = [];
  items.forEach(item => {
    const areaIds = reportState.rubArea ? [reportState.rubArea].filter(id => item.areaIds.has(id)) : Array.from(item.areaIds);
    areaIds.forEach(aid => {
      const opening = from ? balanceAsOf(item.id, aid, dayBefore(from)) : 0;
      const closing = balanceAsOf(item.id, aid, to);
      const entries = entriesFor(item.id, aid).filter(e => (!from || e.entry_date >= from) && e.entry_date <= to);
      let received=0, used=0;
      entries.forEach(e => { received = Math.round((received+Number(e.in_qty||0))*100)/100; used = Math.round((used+Number(e.out_qty||0))*100)/100; });
      if(entries.length === 0 && !from) return; // nothing to show with no range and no activity
      rows.push({ item, areaCode: areaCodeById()[aid], opening, received, used, closing });
    });
  });
  rows.sort((a,b)=> a.item.name.localeCompare(b.item.name) || a.areaCode.localeCompare(b.areaCode));

  const table = rows.length === 0 ? `<div class="empty">Pick a date range to see this report.</div>` : `<table><thead><tr>
      <th>Item</th><th>Area</th><th class="num">Opening</th><th class="num">Received</th><th class="num">Used</th><th class="num">Closing</th>
    </tr></thead><tbody>
      ${rows.map(r => `<tr>
        <td>${escapeHtml(r.item.name)}</td>
        <td>${escapeHtml(r.areaCode)}</td>
        <td class="num">${fmt(r.opening)} ${escapeHtml(r.item.unit_of_measure||'')}</td>
        <td class="num">${fmt(r.received)} ${escapeHtml(r.item.unit_of_measure||'')}</td>
        <td class="num">${fmt(r.used)} ${escapeHtml(r.item.unit_of_measure||'')}</td>
        <td class="num">${fmt(r.closing)} ${escapeHtml(r.item.unit_of_measure||'')}</td>
      </tr>`).join('')}
    </tbody></table>`;

  setPrintHead(`${from||'earliest'} – ${to} ${reportState.rubArea ? ' · Area: '+areaCodeById()[reportState.rubArea] : ''}`);
  body.innerHTML = filterRow + table;
  document.getElementById('rubFrom').addEventListener('change', (e)=>{ reportState.rubFrom = e.target.value; renderRubReport(body); });
  document.getElementById('rubTo').addEventListener('change', (e)=>{ reportState.rubTo = e.target.value; renderRubReport(body); });
  document.getElementById('rubArea').addEventListener('change', (e)=>{ reportState.rubArea = e.target.value; renderRubReport(body); });
}

// 6. Monthly reagent sheet — day-column matrix per item for one area and month, like the paper ledger.
async function renderMonthlyReport(body){
  if(!reportState.monthArea && areas.length) reportState.monthArea = areas.find(a=>a.code===activeAreaCode)?.id || areas[0].id;
  if(!reportState.month) reportState.month = viewDate.slice(0,7);
  await ensureReportRange_(body, reportState.month + '-01');
  const areaOpts = areas.map(a=>`<option value="${a.id}" ${reportState.monthArea===a.id?'selected':''}>${escapeHtml(a.code)}</option>`).join('');
  const filterRow = `<div class="filter-row">
    <label>Area<select id="moArea">${areaOpts}</select></label>
    <label>Month<input type="month" id="moMonth" value="${reportState.month}"></label>
  </div>`;

  const areaId = reportState.monthArea;
  const [y,m] = reportState.month.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const days = Array.from({length:daysInMonth}, (_,i) => {
    const dd = String(i+1).padStart(2,'0');
    const mm = String(m).padStart(2,'0');
    return `${y}-${mm}-${dd}`;
  });

  setPrintHead(`Area: ${areaCodeById()[areaId]||''} · Month: ${reportState.month}`);
  const areaItems = items.filter(i => i.areaIds.has(areaId)).sort((a,b)=>a.name.localeCompare(b.name));
  if(areaItems.length === 0){ body.innerHTML = filterRow + `<div class="empty">No items in this area.</div>`; }
  else{
    const header = `<tr><th style="position:sticky;left:0;background:var(--panel);">Item</th>${days.map(d=>`<th style="text-align:center;">${Number(d.slice(8,10))}</th>`).join('')}</tr>`;
    const rowsHtml = areaItems.map(item => {
      const cells = days.map(d => {
        const e = entryOnDate(item.id, areaId, d);
        const bal = balanceAsOf(item.id, areaId, d);
        if(!e || (!e.in_qty && !e.out_qty && !e.write_off_qty && !e.transfer_qty)){
          return `<td class="num" style="color:var(--text-faint);">${fmt(bal)}</td>`;
        }
        const parts = [];
        if(e.in_qty) parts.push(`<span style="color:var(--ok);">+${fmt(e.in_qty)}</span>`);
        if(e.out_qty) parts.push(`<span style="color:var(--crit);">−${fmt(e.out_qty)}</span>`);
        if(e.write_off_qty) parts.push(`<span style="color:var(--crit);">wo ${fmt(e.write_off_qty)}</span>`);
        if(e.transfer_qty) parts.push(`<span style="color:var(--warn);">xf ${fmt(e.transfer_qty)}</span>`);
        return `<td class="num">${fmt(bal)}<br><span style="font-size:10px;">${parts.join(' ')}</span></td>`;
      }).join('');
      return `<tr><td style="position:sticky;left:0;background:var(--panel);white-space:nowrap;">${escapeHtml(item.name)}</td>${cells}</tr>`;
    }).join('');
    body.innerHTML = filterRow + `<div style="overflow-x:auto;"><table style="font-family:var(--mono);"><thead>${header}</thead><tbody>${rowsHtml}</tbody></table></div>`;
  }

  document.getElementById('moArea').addEventListener('change', (e)=>{ reportState.monthArea = e.target.value; renderMonthlyReport(body); });
  document.getElementById('moMonth').addEventListener('change', (e)=>{ reportState.month = e.target.value; renderMonthlyReport(body); });
}

// ---- Daily grid: spreadsheet-style day entry, mirroring the old Sheet's day-column layout ----
document.getElementById('btnGrid').addEventListener('click', ()=> togglePanel('gridPanel', renderGridPanel));

let gridState = { date: null, areaCode: null };

async function renderGridPanel(){
  const p = document.getElementById('gridPanel');
  if(!gridState.date) gridState.date = viewDate;
  if(!gridState.areaCode) gridState.areaCode = activeAreaCode;

  const needed = dayBefore(gridState.date); // need the prior day's balance as Start Bal
  if(!ledgerLoadedFrom || needed < ledgerLoadedFrom){
    p.innerHTML = `<div class="panel-head"><span class="panel-title"><i class="ti ti-table" aria-hidden="true" style="margin-right:6px;"></i>Daily grid</span><button class="panel-close" data-close>&times;</button></div><div class="empty">Loading history…</div>`;
    await ensureLedgerFrom(needed);
  }
  renderGridTable();
}

function renderGridTable(){
  const p = document.getElementById('gridPanel');
  const area = areas.find(a => a.code === gridState.areaCode) || areas[0];
  if(!area){ p.innerHTML = `<div class="empty">No areas found.</div>`; return; }
  gridState.areaCode = area.code;

  const head = `<div class="panel-head"><span class="panel-title"><i class="ti ti-table" aria-hidden="true" style="margin-right:6px;"></i>Daily grid</span><button class="panel-close" data-close>&times;</button></div>`;
  const areaOpts = areas.map(a=>`<option value="${escapeHtml(a.code)}" ${a.code===area.code?'selected':''}>${escapeHtml(a.code)}</option>`).join('');
  const filterRow = `<div class="filter-row">
    <label>Date<input type="date" id="gridDate" value="${gridState.date}"></label>
    <label>Area<select id="gridArea">${areaOpts}</select></label>
    <button class="small primary" id="gridSaveAll"><i class="ti ti-device-floppy" aria-hidden="true"></i>Save changed rows</button>
  </div>`;

  const areaItems = items.filter(i => i.areaIds.has(area.id)).sort((a,b)=>a.name.localeCompare(b.name));
  if(areaItems.length === 0){
    p.innerHTML = head + filterRow + `<div class="empty">No items in this area.</div>`;
    wireGridControls();
    return;
  }

  const rows = areaItems.map(item => {
    const startBal = balanceAsOf(item.id, area.id, dayBefore(gridState.date));
    const e = entryOnDate(item.id, area.id, gridState.date);
    const endBal = e ? e.balance : startBal;
    return `<tr data-item="${item.id}" data-startbal="${startBal}">
      <td class="item-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</td>
      <td class="gbal">${fmt(startBal)}</td>
      <td><input type="number" step="0.01" min="0" data-f="in" value="${e && e.in_qty ? fmt(e.in_qty) : ''}"></td>
      <td><select data-f="source">${sourceOptionsHtml(area.code, e ? e.source_code : '')}</select></td>
      <td><input type="number" step="0.01" min="0" data-f="out" value="${e && e.out_qty ? fmt(e.out_qty) : ''}"></td>
      <td><input type="number" step="0.01" min="0" data-f="wo" value="${e && e.write_off_qty ? fmt(e.write_off_qty) : ''}"></td>
      <td><select data-f="woreason"><option value="">—</option>${WRITE_OFF_REASONS.map(r=>`<option value="${r}" ${e && e.write_off_reason===r?'selected':''}>${r}</option>`).join('')}</select></td>
      <td><input type="number" step="0.01" min="0" data-f="xfer" value="${e && e.transfer_qty ? fmt(e.transfer_qty) : ''}"></td>
      <td><select data-f="xferto"><option value="">—</option>${destAreaOptionsHtml(area.code).replace(/<option value="([^"]*)"/g, (m,v)=> e && e.transfer_to_code===v ? `<option value="${v}" selected` : m)}</select></td>
      <td class="gbal grow-end">${fmt(endBal)}</td>
      <td><button class="small grow-save" data-act="save-row"><i class="ti ti-check" aria-hidden="true"></i></button></td>
    </tr>`;
  }).join('');

  const table = `<div style="overflow-x:auto;"><table class="grid-table"><thead><tr>
    <th>Item</th><th>Start Bal</th><th>In</th><th>Source</th><th>Out</th><th>W/O</th><th>W/O Reason</th><th>Xfer</th><th>Xfer To</th><th>End Bal</th><th></th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;

  p.innerHTML = head + filterRow + table;
  wireGridControls();
  wireGridRows();
}

function wireGridControls(){
  const p = document.getElementById('gridPanel');
  p.querySelector('[data-close]').addEventListener('click', ()=>{ p.style.display='none'; });
  const dateEl = document.getElementById('gridDate');
  if(dateEl) dateEl.addEventListener('change', async (e)=>{
    gridState.date = e.target.value || todayISO();
    await renderGridPanel();
  });
  const areaEl = document.getElementById('gridArea');
  if(areaEl) areaEl.addEventListener('change', (e)=>{ gridState.areaCode = e.target.value; renderGridTable(); });
  const saveAllBtn = document.getElementById('gridSaveAll');
  if(saveAllBtn) saveAllBtn.addEventListener('click', async ()=>{
    const dirtyRows = Array.from(document.querySelectorAll('.grid-table tbody tr.dirty'));
    for(const tr of dirtyRows){ await saveGridRow(tr); }
  });
}

function wireGridRows(){
  const tbody = document.querySelector('.grid-table tbody');
  if(!tbody) return;
  tbody.addEventListener('input', (e)=>{
    const tr = e.target.closest('tr'); if(tr) tr.classList.add('dirty');
  });
  tbody.addEventListener('click', async (e)=>{
    if(e.target.closest('[data-act="save-row"]')){
      const tr = e.target.closest('tr');
      await saveGridRow(tr);
    }
  });
}

async function saveGridRow(tr){
  const area = areas.find(a => a.code === gridState.areaCode);
  const item = items.find(i => i.id === tr.dataset.item);
  if(!area || !item) return;
  const get = f => tr.querySelector(`[data-f="${f}"]`)?.value?.trim() || '';
  const num = v => v === '' ? 0 : parseFloat(v);

  const inQty = num(get('in')), outQty = num(get('out')), woQty = num(get('wo')), xferQty = num(get('xfer'));
  const source = get('source'), woReason = get('woreason'), xferTo = get('xferto');

  if(inQty > 0 && !source){ showToast('Choose a source for the In quantity.'); return; }
  if(woQty > 0 && !woReason){ showToast('Choose a W/O reason.'); return; }
  if(xferQty > 0 && !xferTo){ showToast('Choose a Xfer To area.'); return; }

  try{
    await callLedgerAction({
      action: 'grid_set', area_code: area.code, item_name: item.name, entry_date: gridState.date,
      in_qty: inQty, source_code: source || undefined,
      out_qty: outQty,
      write_off_qty: woQty, write_off_reason: woReason || undefined,
      transfer_qty: xferQty, transfer_to_code: xferTo || undefined,
    });
    // Pull this item's rows back across ALL areas from the saved date forward:
    // the server may have recomputed later-date balances on this area (a cascading
    // edit) and, for a transfer, also updated the destination (and possibly an
    // old destination it un-linked from) — refresh everything that could have moved.
    const fresh = await fetchLedgerRowsInRange_(gridState.date, null);
    mergeLedgerRows_(fresh.filter(r => r.item_id === item.id));
    tr.classList.remove('dirty');
    tr.querySelector('.grow-end').textContent = fmt(entryOnDate(item.id, area.id, gridState.date)?.balance ?? 0);
    tr.querySelector('.gbal').textContent = fmt(balanceAsOf(item.id, area.id, dayBefore(gridState.date)));
    showToast(`Saved ${item.name}`);
    renderList();
    refreshOpenPanels();
  }catch(err){
    showToast('Save failed: ' + (err.message || String(err)));
  }
}
</script>
</body>
</html>
